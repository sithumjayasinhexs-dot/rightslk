<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RightsLK — Know Your Rights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16233a; --navy2:#1f2f4d; --gold:#f5b942; --gold2:#ffd97a;
  --bg:#f4f6fb; --card:#ffffff; --ink:#1c2433; --mut:#667085;
  --green:#1d9d5f; --amber:#c77f0a; --blue:#2563eb;
  --r:18px; --shadow:0 6px 24px rgba(22,35,58,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; font-family:'Poppins','Noto Sans Sinhala','Noto Sans Tamil',system-ui,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:96px}
header{position:sticky; top:0; z-index:20; background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:20px 18px 16px; border-radius:0 0 26px 26px; box-shadow:var(--shadow)}
.brand{display:flex; align-items:center; gap:12px}
.brand .mark{width:46px; height:46px; border-radius:14px; background:var(--gold); display:grid; place-items:center; font-size:26px; flex:none}
.brand h1{margin:0; font-size:22px; font-weight:800; letter-spacing:.3px}
.brand p{margin:2px 0 0; font-size:12px; color:#c7d2e8}
.langswitch{display:flex; gap:8px; margin-top:12px}
.langswitch button{flex:1; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-family:inherit; font-size:13px; font-weight:600; padding:9px 0; border-radius:99px; cursor:pointer}
.langswitch button.on{background:var(--gold); color:var(--navy); border-color:var(--gold)}
.disclaimer-chip{margin-top:12px; background:rgba(245,185,66,.14); border:1px solid rgba(245,185,66,.45); color:var(--gold2); font-size:11.5px; padding:8px 12px; border-radius:12px; line-height:1.5}
.searchbar{margin:14px 18px 4px; position:relative}
.searchbar input{width:100%; border:none; outline:none; background:#fff; border-radius:14px; padding:13px 14px 13px 44px; font-family:inherit; font-size:14px; box-shadow:var(--shadow)}
.searchbar span{position:absolute; left:15px; top:50%; transform:translateY(-50%); font-size:18px}
.wrap{padding:14px 18px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.scard{background:var(--card); border-radius:var(--r); padding:16px 14px; box-shadow:var(--shadow); cursor:pointer; border:1px solid #e8ecf4; transition:transform .12s}
.scard:active{transform:scale(.97)}
.scard .ic{font-size:30px}
.scard h3{margin:8px 0 4px; font-size:14.5px; font-weight:700; line-height:1.35}
.scard .tag{font-size:11px; color:var(--mut)}
.sec-label{font-size:12px; font-weight:700; letter-spacing:1.2px; color:var(--mut); margin:18px 2px 10px; text-transform:uppercase}
.sheet{position:fixed; inset:0; z-index:50; display:none}
.sheet.open{display:block}
.sheet .scrim{position:absolute; inset:0; background:rgba(10,16,30,.55)}
.sheet .panel{position:absolute; left:0; right:0; bottom:0; max-height:92vh; overflow-y:auto; background:#fff; border-radius:26px 26px 0 0; padding:10px 20px 34px; animation:up .25s ease}
@keyframes up{from{transform:translateY(40px); opacity:.6} to{transform:none; opacity:1}}
.grab{width:44px; height:5px; border-radius:99px; background:#dbe1ec; margin:6px auto 12px}
.panel h2{margin:4px 40px 2px 0; font-size:20px}
.panel .psub{font-size:12.5px; color:var(--mut); margin-bottom:6px}
.closebtn{position:sticky; top:0; float:right; border:none; background:#eef1f7; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; z-index:2}
.block{border-radius:14px; padding:13px 14px; margin:12px 0; font-size:13.5px; line-height:1.65}
.block h4{margin:0 0 8px; font-size:13px; letter-spacing:.6px; text-transform:uppercase}
.block ul{margin:0; padding-left:18px}
.block li{margin:5px 0}
.b-can{background:#e9f7ef; border:1px solid #bfe6cf}.b-can h4{color:var(--green)}
.b-cant{background:#fdf3e2; border:1px solid #f0d9a8}.b-cant h4{color:var(--amber)}
.b-do{background:#e8effd; border:1px solid #c3d4f7}.b-do h4{color:var(--blue)}
.say{background:var(--navy); color:#fff; border-radius:14px; padding:14px; margin:12px 0}
.say h4{margin:0 0 8px; font-size:12px; letter-spacing:1px; color:var(--gold2); text-transform:uppercase}
.say p{margin:8px 0; font-size:13.5px; line-height:1.6}
.say p::before{content:"\201C"; color:var(--gold)}
.say p::after{content:"\201D"; color:var(--gold)}
.note{font-size:12px; color:var(--mut); background:#f2f4f9; border-radius:12px; padding:10px 12px; line-height:1.6}
.foot-disc{margin:18px 2px 0; font-size:11.5px; color:var(--mut); line-height:1.7; border-top:1px dashed #d5dbe7; padding-top:12px}
.ecard{background:#fff; border-radius:var(--r); box-shadow:var(--shadow); padding:16px; margin:10px 0; display:flex; align-items:center; gap:14px; border:1px solid #e8ecf4}
.ecard .eic{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:26px; flex:none}
.ecard .einf{flex:1}
.ecard .einf b{font-size:15px}
.ecard .einf p{margin:3px 0 0; font-size:12px; color:var(--mut); line-height:1.5}
.callbtn{display:inline-block; margin-top:8px; background:var(--green); color:#fff; text-decoration:none; font-weight:700; font-size:13px; padding:9px 18px; border-radius:99px}
nav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid #e6eaf2; display:flex; padding:8px 6px calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -4px 20px rgba(0,0,0,.06)}
nav button{flex:1; border:none; background:none; font-family:inherit; font-size:11px; color:var(--mut); cursor:pointer; padding:6px; border-radius:12px}
nav button .ni{font-size:22px; display:block}
nav button.on{color:var(--navy); font-weight:700}
.hidden{display:none!important}
.empty{text-align:center; color:var(--mut); padding:40px 20px; font-size:14px}
</style>

</head>
<body>

<header>
  <div class="brand">
    <div class="mark">⚖️</div>
    <div><h1>RightsLK</h1><p id="subtitle"></p></div>
  </div>
  <div class="langswitch">
    <button id="lang-en" onclick="setLang('en')">English</button>
    <button id="lang-si" onclick="setLang('si')">සිංහල</button>
    <button id="lang-ta" onclick="setLang('ta')">தமிழ்</button>
  </div>
  <div class="disclaimer-chip" id="discChip"></div>
</header>

<div id="view-situations">
  <div class="searchbar"><span>🔍</span><input id="q" oninput="renderGrid()"></div>
  <div class="wrap">
    <div class="sec-label" id="secSit"></div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="nores"></div>
    <div class="foot-disc" id="aboutText"></div>
  </div>
</div>

<div id="view-emergency" class="hidden">
  <div class="wrap">
    <div class="sec-label" id="secEm"></div>
    <div id="elist"></div>
    <div class="foot-disc" id="emFoot"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="scrim" onclick="closeSheet()"></div>
  <div class="panel">
    <div class="grab"></div>
    <button class="closebtn" onclick="closeSheet()">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<nav>
  <button id="tabS" class="on" onclick="showTab('situations')"><span class="ni">📋</span><span id="tabSit"></span></button>
  <button id="tabE" onclick="showTab('emergency')"><span class="ni">🚨</span><span id="tabEm"></span></button>
</nav>

  do:["වරෙන්තුවක් තිබේදැයි විනීතව අසා, පෙන්විය හැකිදැයි අසන්න — වරෙන්තු අංකය සහ නිකුත් කළ උසාවිය සටහන් කරගන්න","වාචිකව විරෝධය පෑවත්, නිලධාරීන්ට ශාරීරිකව බාධා නොකරන්න","නම්, අංක, වේලාව සහ භාරගත් දේවල් නිවැරදිව සටහන් කරගන්න","භාරගන්නා සෑම දෙයකම ලිඛිත ලැයිස්තුවක් / රිසිට්පතක් ඉල්ලන්න"],
  say:["වරෙන්තුවක් තිබේද? කරුණාකර මට පෙන්වන්න.","මම බාධා කරන්නේ නැහැ, නමුත් මෙම පරීක්ෂාවට මම එකඟ නැහැ.","ඔබ භාරගන්නා සියල්ලේ ලිඛිත ලැයිස්තුවක් දෙන්න."],
  note:"මම එකඟ නැහැ යැයි කීමෙන් පරීක්ෂාව භෞතිකව නැවැත්විය නොහැක, නමුත් පසුව ඔබේ ස්ථාවරය ආරක්ෂා වේ." },

  say:["මගේ දුරකථනය පරීක්ෂා කිරීමට මම එකඟ නැහැ. උසාවි නියෝගයක් තිබේද?","මේකට පිළිතුරු දීමට පෙර නීතිඥවරයෙකු හමුවීමට කැමතියි."],

{ id:"statement", icon:"🏢", title:"ප්‍රකාශයක් සඳහා පොලිස් ස්ථානයට කැඳවයි", tag:"ප්‍රශ්න කිරීම",

  cant:["ඔබ අත්අඩංගුවේ නැත්නම් එන්නට බල කළ නොහැක — ඔබට යා හැකිදැයි අසන්න","පොලිස් නිලධාරියෙකුට ඔබ දුන් පාපොච්චාරණයක් උසාවියේ ඔබට විරුද්ධව භාවිතා කළ නොහැක (සාක්ෂි ආඥා පනත, 25 වගන්තිය)","කියවා තේරුම් නොගත් කිසිවකට අත්සන් කිරීමට බල කළ නොහැක"],
  do:["මුලින්ම අසන්න: මම සැකකරුවෙක්ද, සාක්ෂිකරුවෙක්ද? මට යා හැකිද?","සැකකරුවෙකු විය හැකි නම් නීතිඥවරයෙකු රැගෙන යන්න — කතා කිරීමට පෙර උපදෙස් ගන්න","පොලිස් භාරයේ සිටියදී දුන් පාපොච්චාරණයක් වලංගු වන්නේ මහේස්ත්‍රාත්වරයෙකු ඉදිරියේදී දුන්නොත් පමණි (26 වගන්තිය) — නීතිඥවරයා එනතුරු සිටීමට තවත් හේතුවක්","අත්සන් කිරීමට පෙර සියල්ල කියවන්න; අත්සන් කරන දේ ඡායාරූප ගන්න","නිලධාරියාගේ නම සහ ඔබ පැමිණි / පිටත් වූ වේලාවන් සටහන් කරගන්න"],
  say:["මම මෙහි සැකකරුවෙක්ද, සාක්ෂිකරුවෙක්ද?","මට යා හැකිද?","ප්‍රකාශයක් දීමට පෙර මගේ නීතිඥවරයා සිටිය යුතුයි."],

{ id:"protest", icon:"✊", title:"විරෝධතාවයක / පොදු රැස්වීමක", tag:"රැස්වීම",
  can:["රැස්වීමට පැමිණ නිරීක්ෂණය කළ හැක","විශේෂිත නීති යටතේ කොන්දේසි පැනවීමට හෝ විසුරුවා හැරීමට නියෝග කළ හැක"],
  cant:["සාමකාමී රැස්වීම සම්පූර්ණයෙන්ම තහනම් කළ නොහැක — ඔබට සාමකාමීව රැස්වීමේ ආණ්ඩුක්‍රම ව්‍යවස්ථාමය අයිතියක් ඇත (14(1)(b) ව්‍යවස්ථාව)","සාමකාමී සහභාගිවන්නන්ට අධික බලය භාවිතා කළ නොහැක","සාමාන්‍ය අත්අඩංගුවේ ක්‍රියාපටිපාටියෙන් තොරව අත්අඩංගුවට ගත නොහැක — අත්අඩංගුවේ අයිතිවාසිකම් සියල්ල අදාළ වේ"],
  do:["හැඳුනුම්පත ළඟ තබාගන්න","සාමකාමීව සිටින්න — අයිතිය ආරක්ෂා කරන්නේ සාමකාමී රැස්වීමයි","යමක් සිදුවුවහොත් නිලධාරීන්ගේ අංක සටහන් කරගන්න","හැකි නම් ආරක්ෂිත දුරකින් වීඩියෝ කරන්න","ඔබ කොහේද යන්න දන්නා හදිසි සම්බන්ධතාවක් තබාගන්න"],
  say:["මම සාමකාමීව රැස්වී සිටින්නෙමි.","කරුණාකර ඔබේ අනන්‍යතාව කියන්න, නිලධාරීතුමනි."],
  note:"විරෝධතාවයකදී අත්අඩංගුවට පත්වුණොත්, පොලිසිය අත්අඩංගුවට ගනී කාඩ්පත බලන්න — එහි අයිතිවාසිකම් සියල්ල අදාළ වේ." },
{ id:"complaint", icon:"📝", title:"පොලිසියට විරුද්ධව පැමිණිල්ලක්", tag:"වගවීම",
  can:["ශ්‍රී ලංකා මානව හිමිකම් කොමිසමට (HRCSL) පැමිණිලි කළ හැක — පැය 24 පුරා ක්‍රියාත්මක 1996 හදිසි අංකය","නිලධාරීන්ගේ වැරදි හැසිරීම් ගැන ජාතික පොලිස් කොමිසමට පැමිණිලි කළ හැක","නීති ආධාර කොමිසමෙන් නොමිලේ නීති උපකාර ලබාගත හැක (011-2433618)"],

  do:["හැකි ඉක්මනින් සියල්ල ලියාගන්න: නම්, අංක, වේලාව, ස්ථානය, සාක්ෂිකරුවන්","තුවාල ඇත්නම් වහාම වෛද්‍ය වාර්තාවක් ගන්න — එය ප්‍රධාන සාක්ෂියකි","ඉදිරිපත් කරන සියල්ලේ පිටපත් තබාගන්න","පැමිණිලි සිංහල, දෙමළ හෝ ඉංග්‍රීසි යන ඕනෑම බසකින් කළ හැක"],

  do:["පළමු මහේස්ත්‍රාත් හමුවේදීම (අත්අඩංගුවෙන් පැය 24ක් ඇතුළත) ඇප ඉල්ලීමට නීතිඥවරයා ලවා ඉල්ලන්න","ඇපකරුවෙකු සූදානම් කරගන්න — උසාවි බොහෝ විට ඉල්ලයි","ඇප කොන්දේසි සියල්ල තදින්ම පිළිපදින්න — කඩකිරීමෙන් ඇප අහෝසි විය හැක"],
  say:["මගේ නීතිඥවරයා හරහා ඇප ඉල්ලීමට කැමතියි."],

ta: { ui: {
  subtitle: "உங்கள் உரிமைகளை எளிய மொழியில் அறிந்துகொள்ளுங்கள்",

  searchPh: "சூழ்நிலைகளைத் தேடுங்கள்… எ.கா: கைது, தொலைபேசி, பிணை",
  secSit: "பொதுவான சூழ்நிலைகள்", secEm: "அவசர அழைப்புகள்",

  theyCan: "✅ அவர்கள் செய்யக்கூடியவை", limits: "⛔ அவர்களின் அதிகார வரம்புகள்", youDo: "🧭 நீங்கள் செய்ய வேண்டியவை", sayThis: "🗣️ இப்படிச் சொல்லுங்கள்",
  callNow: "📞 இப்போது அழைக்கவும்",
  about: "<b>இந்த செயலி பற்றி:</b> RightsLK அரசியலமைப்பு (உறுப்புகள் 11 & 13), குற்றவியல் நடைமுறைச் சட்டம், மோட்டார் போக்குவரத்துச் சட்டம், சாட்சியக் கட்டளைச் சட்டம் மற்றும் அதிகாரப்பூர்வ அவசர எண்களின் அடிப்படையில் இலங்கையின் அன்றாட சட்ட உரிமைகளை எளிய மொழியில் சுருக்குகிறது. சிங்களம் மற்றும் தமிழ் எளிய மொழிபெயர்ப்புகள் — ஆங்கில உரையே மூலமாகும். இது வழக்கறிஞருக்கு மாற்று அல்ல. இப்போது சிக்கலில் இருந்தால், அவசர தாவலைப் பயன்படுத்துங்கள்.",
  emFoot: "எண்கள் அதிகாரப்பூர்வ மூலங்களிலிருந்து (காவல்துறை, HRCSL, சட்ட உதவி ஆணையம்). ஒரு எண் வேலை செய்யாவிட்டால் மற்றவற்றை முயலுங்கள் — அருகிலுள்ளவரிடம் என்ன நடக்கிறது என்று சொல்லுங்கள்.",
  sheetFoot: "பொதுவான தகவல், சட்ட ஆலோசனை அல்ல. இது இப்போது உங்களுக்கு நடந்தால், அவசர தாவலுக்கு மாறுங்கள்."
},
situations: [
{ id:"traffic", icon:"🚦", title:"போக்குவரத்து போலீசார் நிறுத்தினால்", tag:"சாலை / வாகனம் ஓட்டுதல்",
  can:["உங்கள் ஓட்டுநர் உரிமத்தைக் கேட்கலாம் — சட்டப்படி அதை எப்போதும் உடன் வைத்திருந்து காவலர் கேட்கும்போது காட்ட வேண்டும் (மோட்டார் போக்குவரத்துச் சட்டம்)","வருவாய் உரிமம், காப்பீடு மற்றும் வாகன ஆவணங்களைச் சரிபார்க்கலாம்","விசாரணையின்போது உங்கள் உரிமத்தைத் தற்காலிகமாக வைத்துக்கொள்ளலாம் — ஆனால் எழுத்துப்பூர்வ தற்காலிக அனுமதி வழங்க வேண்டும்","சிறு குற்றங்களுக்கு இடத்திலேயே அபராதம் விதிக்கலாம் — 14 நாட்களுக்குள் எந்த தபால் நிலையத்திலும் செலுத்தலாம்"],
  cant:["சாலையிலேயே பணம் கேட்டு சமரசம் செய்ய முடியாது — அபராதம் அதிகாரப்பூர்வ ரசீது மூலம் அல்லது நீதிமன்றத்தில் செலுத்தப்பட வேண்டும்","தற்காலிக அனுமதி வழங்காமல் உங்கள் உரிமத்தை வைத்துக்கொள்ள முடியாது","ஆபத்தான வாகனம் ஓட்டுதலுக்கு இடத்திலேயே அபராதம் விதிக்க முடியாது — 2026 காவல்துறை உத்தரவுப்படி இவை நேரடியாக நீதிமன்றத்திற்குச் செல்லும்"],
  do:["அமைதியாக இருங்கள்; இறங்கச் சொல்லும் வரை வாகனத்திலேயே இருங்கள்","அதிகாரியின் பெயர் மற்றும் பணி எண்ணைப் பணிவாகக் கேளுங்கள்","ஒருபோதும் லஞ்சம் கொடுக்க முயலாதீர்கள் — அதுவே குற்றம்","இடத்திலேயே அபராதத்தை மறுத்து, வழக்கை நீதிமன்றத்தில் விசாரிக்கக் கோரலாம்","செலுத்தும் தொகைக்கு அதிகாரப்பூர்வ ரசீதை வைத்துக்கொள்ளுங்கள்; ரசீது மற்றும் தற்காலிக அனுமதியைக் காட்டி உரிமத்தைத் திரும்பப் பெறுங்கள்"],
  say:["அதிகாரியே, உங்கள் அடையாள அட்டையைக் காட்ட முடியுமா?","இதை நீதிமன்றத்தில் விசாரிக்க விரும்புகிறேன்."],
  note:"இடத்திலேயே அபராத விதிகள் அடிக்கடி மாறும். சந்தேகம் இருந்தால், சாலையில் செலுத்துவதை விட நீதிமன்ற வழியைத் தேர்ந்தெடுங்கள்." },
{ id:"arrest", icon:"🚨", title:"போலீசார் கைது செய்தால்", tag:"மிக முக்கியம்",
  can:["கடுமையான குற்றங்களுக்கு பிடிவாரண்ட் இல்லாமல் கைது செய்யலாம்","நீங்கள் எதிர்த்தால் நியாயமான பலத்தைப் பயன்படுத்தலாம்"],
  cant:["சட்டப்படியான நடைமுறை இல்லாமல் தன்னிச்சையாகக் கைது செய்ய முடியாது (அரசியலமைப்பு, உறுப்பு 13(1))","நீதவான் முன் நிறுத்தாமல் 24 மணி நேரத்திற்கு மேல் தடுத்து வைக்க முடியாது (குற்றவியல் நடைமுறைச் சட்டம், பிரிவு 37)","சித்திரவதை செய்ய முடியாது — முற்றிலும் தடை (அரசியலமைப்பு, உறுப்பு 11)","மிரட்டி ஒப்புதல் வாக்குமூலம் பெற முடியாது — மிரட்டலில் பெற்ற வாக்குமூலம் நீதிமன்றத்தில் செல்லாது"],
  do:["கைது தவறு என்று நினைத்தாலும் உடல்ரீதியாக எதிர்க்க வேண்டாம்","என்னை ஏன் கைது செய்கிறீர்கள் என்று தெளிவாகக் கேளுங்கள் — காரணம் சொல்ல வேண்டும்","பெயர், அடிப்படை விவரங்களைக் கொடுத்துவிட்டு, வழக்கறிஞர் வரும் வரை மௌனமாக இருங்கள்","குடும்பத்தினருக்கும் வழக்கறிஞருக்கும் உடனே தகவல் சொல்லக் கோருங்கள்","அதிகாரிகளின் பெயர், எண், நேரம், இடத்தை நினைவில் வைத்துக்கொள்ளுங்கள்","காயம் இருந்தால் மருத்துவரைப் பார்க்கக் கோருங்கள்"],
  say:["என்னைக் கைது செய்யும் காரணத்தைச் சொல்லுங்கள்.","எனக்கு ஒரு வழக்கறிஞரைச் சந்திக்க வேண்டும், அதுவரை மௌனமாக இருப்பேன்.","நான் எங்கே இருக்கிறேன் என்பதை என் குடும்பத்திற்குத் தெரிவியுங்கள்."],
  note:"24 மணி நேரத்திற்குள் அருகிலுள்ள நீதவான் முன் நிறுத்தப்பட வேண்டும். அதன் பின் தடுப்புக்கு நீதவானின் உத்தரவு தேவை." },
{ id:"search", icon:"🔍", title:"போலீசார் உங்களையோ வாகனத்தையோ வீட்டையோ சோதனையிட்டால்", tag:"சோதனைகள்",
  can:["சட்டப்பூர்வ கைதுக்குப் பின் உங்களைச் சோதனையிடலாம்","சட்டம் குறிப்பாக அனுமதிக்கும் சூழலில் உங்கள் வாகனத்தைச் சோதனையிடலாம்"],
  cant:["பெரும்பாலான சூழலில் நீதவானின் சோதனை பிடிவாரண்ட் இல்லாமல் உங்கள் வீட்டைச் சோதனையிட முடியாது","ஆண் அதிகாரி ஒரு பெண்ணின் உடலைச் சோதனையிட முடியாது — பெண்ணை இன்னொரு பெண்ணே சோதனையிட வேண்டும்","பதிவு இல்லாமல் உங்கள் பொருட்களைக் கைப்பற்ற முடியாது"],
  do:["பிடிவாரண்ட் உள்ளதா, காட்ட முடியுமா என்று பணிவாகக் கேளுங்கள் — வாரண்ட் எண், வழங்கிய நீதிமன்றத்தைக் குறித்துக்கொள்ளுங்கள்","வாய்மொழியாக எதிர்த்தாலும், அதிகாரிகளை உடல்ரீதியாகத் தடுக்க வேண்டாம்","பெயர்கள், எண்கள், நேரம், எடுக்கப்பட்ட பொருட்களைத் துல்லியமாகக் குறித்துக்கொள்ளுங்கள்","எடுக்கப்படும் ஒவ்வொன்றுக்கும் எழுத்துப்பூர்வ பட்டியல் / ரசீது கேளுங்கள்"],
  say:["பிடிவாரண்ட் உள்ளதா? தயவுசெய்து காட்டுங்கள்.","நான் தடுக்கவில்லை, ஆனால் இந்தச் சோதனைக்கு நான் சம்மதிக்கவில்லை.","நீங்கள் எடுக்கும் அனைத்திற்கும் எழுத்துப்பூர்வ பட்டியல் தாருங்கள்."],
  note:"நான் சம்மதிக்கவில்லை என்பது சோதனையை உடல்ரீதியாக நிறுத்தாது, ஆனால் பின்னர் உங்கள் நிலையைப் பாதுகாக்கும்." },
{ id:"phone", icon:"📱", title:"தொலைபேசியைத் திறக்கச் சொன்னால்", tag:"டிஜிட்டல் உரிமைகள்",
  can:["தொலைபேசியை ஒப்படைக்க அல்லது திறக்கக் கோரலாம்"],
  cant:["இடத்திலேயே கடவுச்சொல்லை வெளியிடுமாறு கட்டாயப்படுத்தும் தெளிவான சட்டம் இலங்கையில் இல்லை — இது சட்டரீதியாகத் தெளிவற்ற பகுதி"],
  do:["நீதிமன்ற உத்தரவு இல்லாமல் கடவுச்சொல்லைத் தானாகத் தர வேண்டிய கட்டாயம் இல்லை — பணிவாக மறுக்கவும்","இதற்கு நீதிமன்ற உத்தரவு உள்ளதா என்று கேளுங்கள்","எதையும் அழிக்க வேண்டாம் — சாட்சியை அழிப்பதும் குற்றம்","எந்தக் கோரிக்கையையும் எழுத்துப்பூர்வமாகக் கேளுங்கள்"],
  say:["என் தொலைபேசியைச் சோதனையிட நான் சம்மதிக்கவில்லை. நீதிமன்ற உத்தரவு உள்ளதா?","பதில் சொல்வதற்கு முன் வழக்கறிஞரைச் சந்திக்க விரும்புகிறேன்."],
  note:"இது உண்மையிலேயே தெளிவற்ற சட்டப் பகுதி. சட்டம் தெளிவாகும் வரை, பணிவாக மறுப்பதும் வழக்கறிஞரைக் கேட்பதும் பாதுகாப்பான வழி." },
{ id:"statement", icon:"🏢", title:"வாக்குமூலத்திற்காக காவல் நிலையத்திற்கு அழைத்தால்", tag:"விசாரணை",

let lang = localStorage.getItem("rightslk_lang") || "en";
if(!LANGS[lang]) lang = "en";
function L(){ return LANGS[lang]; }
function esc(s){ return String(s).replace(/</g,"&lt;"); }
function li(arr){ return "<ul>"+arr.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")+"</ul>"; }

function renderChrome(){
  var u = L().ui;
  document.getElementById("subtitle").textContent = u.subtitle;
  document.getElementById("discChip").innerHTML = u.disc;
  document.getElementById("q").placeholder = u.searchPh;
  document.getElementById("secSit").textContent = u.secSit;
  document.getElementById("secEm").textContent = u.secEm;
  document.getElementById("tabSit").textContent = u.tabSit;
  document.getElementById("tabEm").textContent = u.tabEm;
  document.getElementById("nores").textContent = u.nores;
  document.getElementById("aboutText").innerHTML = u.about;
  document.getElementById("emFoot").textContent = u.emFoot;
  ["en","si","ta"].forEach(function(k){
    document.getElementById("lang-"+k).classList.toggle("on", k===lang);
  });
  document.documentElement.lang = lang;
}
function renderGrid(){
  var u = L().ui, q = document.getElementById("q").value.trim().toLowerCase();
  var grid = document.getElementById("grid"); grid.innerHTML = "";
  var n = 0;
  L().situations.forEach(function(s){
    var hay = (s.title+" "+s.tag+" "+s.can.join(" ")+" "+s.do.join(" ")).toLowerCase();
    if(q && hay.indexOf(q)<0) return;
    n++;
    var d = document.createElement("div");
    d.className = "scard";
    d.onclick = (function(id){ return function(){ openSheet(id); }; })(s.id);
    d.innerHTML = '<div class="ic">'+s.icon+'</div><h3>'+esc(s.title)+'</h3><div class="tag">'+esc(s.tag)+"</div>";
    grid.appendChild(d);
  });
  document.getElementById("nores").classList.toggle("hidden", n>0);
}
function openSheet(id){
  var u = L().ui;
  var s = null;
  L().situations.forEach(function(x){ if(x.id===id) s=x; });
  if(!s) return;
  document.getElementById("sheetBody").innerHTML =
    "<h2>"+s.icon+" "+esc(s.title)+'</h2><div class="psub">'+esc(s.tag)+"</div>"+
    '<div class="block b-can"><h4>'+esc(u.theyCan)+"</h4>"+li(s.can)+"</div>"+
    '<div class="block b-cant"><h4>'+esc(u.limits)+"</h4>"+li(s.cant)+"</div>"+
    '<div class="block b-do"><h4>'+esc(u.youDo)+"</h4>"+li(s.do)+"</div>"+
    '<div class="say"><h4>'+esc(u.sayThis)+"</h4>"+s.say.map(function(x){ return "<p>"+esc(x)+"</p>"; }).join("")+"</div>"+
    '<div class="note">'+esc(s.note)+"</div>"+
    '<div class="foot-disc">'+esc(u.sheetFoot)+"</div>";
  document.getElementById("sheet").classList.add("open");
  document.querySelector(".sheet .panel").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.body.style.overflow = "";
}
function showTab(t){
  var s = (t==="situations");
  document.getElementById("view-situations").classList.toggle("hidden", !s);
  document.getElementById("view-emergency").classList.toggle("hidden", s);
  document.getElementById("tabS").classList.toggle("on", s);
  document.getElementById("tabE").classList.toggle("on", !s);
  window.scrollTo(0,0);
}
function renderEmergency(){
  var u = L().ui, el = document.getElementById("elist");
  el.innerHTML = "";
  L().contacts.forEach(function(c){
    var d = document.createElement("div");
    d.className = "ecard";
    d.innerHTML = '<div class="eic" style="background:'+c.bg+'">'+c.icon+"</div>"+
      '<div class="einf"><b>'+esc(c.name)+" — "+esc(c.num)+"</b><p>"+esc(c.desc)+"</p>"+
      '<a class="callbtn" href="tel:'+c.tel+'">'+esc(u.callNow)+"</a></div>";
    el.appendChild(d);
  });
}
function setLang(l){
  if(!LANGS[l]) return;
  lang = l;
  try{ localStorage.setItem("rightslk_lang", l); }catch(e){}
  closeSheet();
  renderChrome(); renderGrid(); renderEmergency();
}
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });
renderChrome(); renderGrid(); renderEmergency();
</script>
